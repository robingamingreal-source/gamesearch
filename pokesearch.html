<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game Search 🔎</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Game Search 🔎</h1>
        <hr>
        <input type="text" id="search-input" placeholder="Enter Pokémon name or ID">
        <button onclick="pokefetch()">Search</button>
        <p>Search in the Pokedex</p>
        <hr>
        <h2>Output</h2>
        <img src="" alt="Search to get an Image of the Pokemon!" id="Pokeimg">
        <p id="name">Name: <span id="name-value"></span></p>
        <p id="weight">Weight: <span id="weight-value"></span></p>
        <p id="pp">Position in Pokedex: <span id="pp-value"></span></p>
        <hr>
    <button href="index.html" onclick="window.location.href='index.html'">Back to Home</button>
    </body>
    <script src="script.js"></script>
</html>
